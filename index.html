<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rustam Bulatov — Film Director</title>
<meta name="description" content="Director Rustam Bulatov. Warsaw and Europe. Commercials, music videos and short films." />
<meta name="theme-color" content="#080d13" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Rustam Bulatov — Film Director" />
<meta property="og:description" content="Director Rustam Bulatov. Warsaw and Europe." />
<meta property="og:image" content="assets/img/og.jpg" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>

<body>
<div class="grain" aria-hidden="true"></div>

<!-- ░░ NAV ░░ -->
<header class="nav" id="nav">
  <a class="nav__brand mono" href="#top" id="brandName"></a>

  <nav class="nav__links" id="navLinks">
    <a href="#work" class="mono" data-i18n="nav.work"></a>
    <a href="#about" class="mono" data-i18n="nav.about"></a>
    <a href="#contact" class="mono" data-i18n="nav.contact"></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang__btn mono is-active" data-setlang="en">EN</button>
      <span class="lang__sep mono">/</span>
      <button type="button" class="lang__btn mono" data-setlang="pl">PL</button>
    </div>
  </nav>

  <button class="nav__burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="navLinks">
    <i></i><i></i>
  </button>
</header>

<main id="top">

  <!-- ░░ HERO ░░ -->
  <section class="hero" id="hero">
    <h1 class="hero__title">
      <span class="line"><span data-i18n="hero.title.1"></span></span>
      <span class="line"><span data-i18n="hero.title.2"></span></span>
    </h1>

    <div class="reel reveal" id="reel">
      <div class="reel__head">
        <span class="mono muted"><span data-i18n="reel.label"></span> <span id="reelYear"></span></span>
      </div>

      <button class="reel__stage" type="button" id="reelPlay" aria-label="Play showreel">
        <span class="reel__media" id="reelMedia"></span>
        <span class="reel__btn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11.25" stroke="currentColor" stroke-width="1"/><path d="M10 8.5 16 12l-6 3.5z" fill="currentColor"/></svg>
        </span>
        <span class="reel__bar">
          <span class="mono" data-i18n="reel.play"></span>
        </span>
      </button>
    </div>
  </section>

  <!-- ░░ WORK ░░ -->
  <section class="section" id="work">
    <div class="section__head">
      <span class="mono muted"><span data-i18n="work.label"></span> — <span id="workCount"></span></span>
      <button class="sort mono muted" type="button" id="sortBtn" aria-label="Sort by year">
        <span data-i18n="work.sort"></span> <i id="sortArrow">↓</i>
      </button>
    </div>

    <div class="table">
      <div class="table__head mono muted" aria-hidden="true">
        <span data-i18n="work.col.n"></span>
        <span data-i18n="work.col.title"></span>
        <span data-i18n="work.col.format"></span>
        <span data-i18n="work.col.year"></span>
      </div>
      <div class="table__body" id="workList"></div>
    </div>
  </section>

  <!-- ░░ ABOUT ░░ -->
  <section class="section section--about" id="about">
    <p class="mono muted" data-i18n="about.label"></p>

    <div class="about">
      <div class="about__text reveal" id="aboutText"></div>
      <dl class="about__meta" id="aboutMeta"></dl>
    </div>
  </section>

  <!-- ░░ CONTACT ░░ -->
  <section class="section section--contact" id="contact">
    <div class="contact">
      <a class="contact__email reveal" id="contactEmail" href="#"></a>
      <ul class="socials mono" id="socials"></ul>
    </div>
  </section>
</main>

<footer class="footer mono muted">
  <span><span id="footYear"></span> <span id="footName"></span></span>
  <span id="footCity"></span>
</footer>

<!-- ░░ VIDEO MODAL ░░ -->
<div class="modal" id="modal" hidden>
  <button class="modal__backdrop" id="modalBackdrop" tabindex="-1" aria-hidden="true"></button>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Video">
    <button class="modal__close mono" id="modalClose">
      <span data-i18n="modal.close"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
    <div class="modal__stage" id="modalStage"></div>
    <div class="modal__meta" id="modalMeta"></div>
  </div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
