<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rustam Bulatov — Film Director, Warsaw</title>
<meta name="description" content="Rustam Bulatov — film director based in Warsaw, working across Europe. Films, music videos, commercials." />
<meta name="author" content="Rustam Bulatov" />
<meta name="theme-color" content="#0d100e" />
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
<link rel="canonical" href="https://rbulatov.com/" id="metaCanonical" />

<!-- ░░ ПРЕВЬЮ ССЫЛКИ (Telegram, WhatsApp, Facebook, LinkedIn, Slack, X) ░░
     Картинка: assets/img/og.jpg — 1200×630.
     Пути ниже — от корня сайта, они верны на любом домене. Когда появится
     свой адрес — впиши его одной строкой в content.js → SITE.url, и app.js
     сам подставит абсолютные ссылки (их требуют LinkedIn, X и часть ботов). -->
<meta property="og:type" content="profile" />
<meta property="og:site_name" content="Rustam Bulatov" />
<meta property="og:locale" content="en_US" />
<meta property="og:locale:alternate" content="pl_PL" />
<meta property="og:url" content="https://rbulatov.com/" id="metaOgUrl" />
<meta property="og:title" content="Rustam Bulatov — Film Director, Warsaw" />
<meta property="og:description" content="Film director based in Warsaw, working across Europe. Films, music videos, commercials." />
<meta property="og:image" content="https://rbulatov.com/assets/img/og.jpg" id="metaOgImage" />
<meta property="og:image:secure_url" content="https://rbulatov.com/assets/img/og.jpg" id="metaOgImageSecure" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Portrait of film director Rustam Bulatov" />
<meta property="profile:first_name" content="Rustam" />
<meta property="profile:last_name" content="Bulatov" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Rustam Bulatov — Film Director, Warsaw" />
<meta name="twitter:description" content="Film director based in Warsaw, working across Europe. Films, music videos, commercials." />
<meta name="twitter:image" content="https://rbulatov.com/assets/img/og.jpg" id="metaTwImage" />
<meta name="twitter:image:alt" content="Portrait of film director Rustam Bulatov" />

<!-- ░░ СТРУКТУРИРОВАННЫЕ ДАННЫЕ ДЛЯ ПОИСКОВИКОВ ░░
     Фото человека — тот же портрет, что в секции ABOUT. Список sameAs
     app.js перезаписывает из content.js → SITE.socials; здесь он лежит
     для ботов, которые не выполняют JS.                                  -->
<script type="application/ld+json" id="ldPerson">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Rustam Bulatov",
  "alternateName": "Рустам Булатов",
  "jobTitle": "Film Director",
  "description": "Film director based in Warsaw, working across Europe. Films, music videos, commercials.",
  "url": "https://rbulatov.com/",
  "email": "mailto:rustambulatov05@gmail.com",
  "knowsLanguage": ["en", "pl", "ru"],
  "image": {
    "@type": "ImageObject",
    "url": "https://rbulatov.com/assets/img/portrait.jpg",
    "width": 1000,
    "height": 1226,
    "caption": "Rustam Bulatov"
  },
  "sameAs": ["https://www.instagram.com/rustambulatov_/"],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Warsaw",
    "addressCountry": "PL"
  },
  "workLocation": {
    "@type": "Place",
    "name": "Warsaw, Europe"
  }
}
</script>

<link rel="image_src" href="https://rbulatov.com/assets/img/og.jpg" id="metaImageSrc" />
<!-- ░░ ИКОНКА САЙТА ░░
     Логотип RB. Поисковики и мобильные браузеры берут разные форматы,
     поэтому кладём весь набор: .ico в корне (за ним боты идут первым),
     PNG 48/96 (Google требует размер, кратный 48), SVG для чётких вкладок
     на десктопе и apple-touch-icon для «на экран Домой» в iOS.           -->
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/assets/favicon-48.png" type="image/png" sizes="48x48" />
<link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>

<body>
<div class="grain" aria-hidden="true"></div>

<!-- ░░ ЛОГОТИП RB ░░ Одна фигура, дырка в «глазу» вырезана маской, поэтому
     знак одинаково чисто ложится и на тёмный, и на светлый фон. -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <mask id="rbMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080">
      <rect width="1080" height="1080" fill="#000"/>
      <rect x="242" y="243" width="203" height="594" fill="#fff"/>
      <path d="M489 243 H836 V837 L489 506 Z" fill="#fff"/>
      <circle cx="836" cy="349" r="106" fill="#000"/>
    </mask>
    <symbol id="rbMark" viewBox="0 0 1080 1080">
      <rect width="1080" height="1080" fill="currentColor" mask="url(#rbMask)"/>
    </symbol>
  </defs>
</svg>

<!-- ░░ NAV ░░ -->
<header class="nav" id="nav">
  <a class="nav__brand mono" href="#top">
    <svg class="mark" aria-hidden="true"><use href="#rbMark"/></svg>
    <span id="brandName"></span>
  </a>

  <nav class="nav__links" id="navLinks">
    <a href="#top" class="mono" data-i18n="nav.index"></a>
    <a href="#work" class="mono" data-i18n="nav.work"></a>
    <a href="#about" class="mono" data-i18n="nav.about"></a>
    <a href="#contact" class="mono" data-i18n="nav.contact"></a>
  </nav>

  <!-- Язык всегда в шапке — на телефоне тоже, а не внутри меню. -->
  <div class="nav__actions">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang__btn mono is-active" data-setlang="en">EN</button>
      <span class="lang__sep mono">/</span>
      <button type="button" class="lang__btn mono" data-setlang="pl">PL</button>
    </div>

    <button class="nav__burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="navLinks">
      <i></i><i></i>
    </button>
  </div>
</header>

<main id="top">

  <!-- ░░ HERO ░░
       Первый экран собран колонкой: текст → подпись шоурила → шоурил →
       линия → имя. Шоурил тянется по остатку высоты, поэтому имя целиком
       видно без прокрутки на любом экране. -->
  <section class="hero" id="hero">
    <div class="hero__intro">
      <p class="mono hero__note" id="heroStatement"></p>
    </div>

    <!-- Шоурил на первом экране. Кадр держит пропорции самого файла (их
         подставляет app.js), поэтому видео видно целиком и не режет на низких
         экранах ноутбука. Подпись сверху идёт по ширине кадра: вместе с линией
         под видео она берёт его в тонкую рамку. -->
    <div class="hero__stage" id="reel">
      <div class="reel__box" id="reelBox">
        <div class="hero__meta mono muted" id="reelBar">
          <span><span data-i18n="reel.label"></span> <span id="reelYear"></span></span>
          <span id="reelDuration"></span>
        </div>

        <div class="reel" id="reelFrame">
          <span class="reel__media" id="reelMedia"></span>
          <button class="reel__open" type="button" id="reelOpen" aria-label="Open showreel full screen"></button>
        </div>
      </div>
    </div>

    <div class="hero__rule">
      <span class="label mono">
        <svg class="mark" aria-hidden="true"><use href="#rbMark"/></svg>
        <span data-i18n="hero.role"></span>
      </span>
      <span class="mono muted" data-i18n="hero.place"></span>
    </div>

    <h1 class="hero__name" id="heroName"><span id="heroNameText"></span></h1>
  </section>

  <!-- ░░ WORK ░░ -->
  <section class="section" id="work">
    <div class="section__head">
      <span class="label mono">
        <svg class="mark" aria-hidden="true"><use href="#rbMark"/></svg>
        <span data-i18n="work.label"></span> — <span id="workCount"></span>
      </span>
      <button class="sort mono muted" type="button" id="sortBtn" aria-label="Sort by year">
        <span data-i18n="work.sort"></span> <i id="sortArrow">↓</i>
      </button>
    </div>

    <!-- director: все работы -->
    <div class="work-group">
      <h2 class="work-group__title" data-i18n="work.group.director"></h2>
      <div class="table">
        <div class="table__head mono muted" aria-hidden="true">
          <span data-i18n="work.col.n"></span>
          <span data-i18n="work.col.title"></span>
          <span data-i18n="work.col.format"></span>
          <span data-i18n="work.col.year"></span>
        </div>
        <div class="table__body" id="workList"></div>
      </div>
    </div>

    <!-- editor: работы с edited: true в content.js -->
    <div class="work-group">
      <h2 class="work-group__title" data-i18n="work.group.editor"></h2>
      <div class="table">
        <div class="table__head mono muted" aria-hidden="true">
          <span data-i18n="work.col.n"></span>
          <span data-i18n="work.col.title"></span>
          <span data-i18n="work.col.format"></span>
          <span data-i18n="work.col.year"></span>
        </div>
        <div class="table__body" id="editList"></div>
      </div>
    </div>
  </section>

  <!-- ░░ ABOUT ░░ светлая полоса на тёмной странице -->
  <section class="section section--about" id="about">
    <p class="label mono">
      <svg class="mark" aria-hidden="true"><use href="#rbMark"/></svg>
      <span data-i18n="about.label"></span>
    </p>

    <div class="about">
      <div class="about__text reveal" id="aboutText"></div>

      <div class="about__side">
        <!-- Портрет. Замена — assets/img/portrait.jpg (вертикальный кадр). -->
        <figure class="about__photo reveal">
          <img src="assets/img/portrait.jpg" width="1000" height="1226"
               alt="Rustam Bulatov, film director based in Warsaw"
               loading="lazy" decoding="async" />
          <figcaption class="mono" id="aboutPhotoCaption"></figcaption>
        </figure>

        <dl class="about__meta" id="aboutMeta"></dl>
      </div>
    </div>
  </section>

  <!-- ░░ CONTACT ░░ -->
  <section class="section section--contact" id="contact">
    <p class="label mono" data-i18n="contact.label"></p>

    <div class="contact">
      <a class="contact__email reveal" id="contactEmail" href="#"></a>

      <div class="contact__side">
        <svg class="contact__mark" aria-hidden="true"><use href="#rbMark"/></svg>
        <ul class="socials mono" id="socials"></ul>
      </div>
    </div>
  </section>
</main>

<footer class="footer mono muted">
  <span><span id="footYear"></span> <span id="footName"></span></span>
  <span id="footCity"></span>
</footer>

<!-- ░░ VIDEO MODAL ░░ -->
<div class="modal" id="modal" hidden>
  <button class="modal__backdrop" id="modalBackdrop" tabindex="-1" aria-hidden="true"></button>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Video">
    <button class="modal__close mono" id="modalClose">
      <span data-i18n="modal.close"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
    <div class="modal__stage" id="modalStage"></div>
    <div class="modal__meta" id="modalMeta"></div>
  </div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
