<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rustam Bulatov — Film Director</title>
<meta name="description" content="Director Rustam Bulatov. Warsaw and Europe. Commercials, music videos and short films." />
<meta name="theme-color" content="#070D13" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Rustam Bulatov — Film Director" />
<meta property="og:description" content="Commercials, music videos and short films." />
<meta property="og:image" content="assets/img/og.jpg" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Poppins:wght@200;300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>

<body>
<!-- film grain overlay -->
<div class="grain" aria-hidden="true"></div>

<!-- ░░ NAV ░░ -->
<header class="nav" id="nav">
  <a class="nav__brand mono" href="#top" id="brandName"></a>

  <nav class="nav__links" id="navLinks">
    <a class="mono" href="#work" data-i18n="nav.work"></a>
    <a class="mono" href="#frames" data-i18n="nav.frames"></a>
    <a class="mono" href="#about" data-i18n="nav.about"></a>
    <a class="mono" href="#contact" data-i18n="nav.contact"></a>
    <span class="nav__lang mono" role="group" aria-label="Language">
      <button type="button" class="lang__btn is-active" data-setlang="en">EN</button>
      <span class="lang__sep">/</span>
      <button type="button" class="lang__btn" data-setlang="pl">PL</button>
    </span>
  </nav>

  <button class="nav__burger" id="burger" aria-label="Menu" aria-expanded="false">
    <i></i><i></i>
  </button>
</header>

<main id="top">

  <!-- ░░ HERO ░░ -->
  <section class="hero" id="hero">
    <h1 class="hero__title reveal">
      <span data-i18n="hero.title.1"></span><br />
      <span data-i18n="hero.title.2"></span>
    </h1>

    <div class="hero__reelmeta mono reveal">
      <span><span data-i18n="hero.reel"></span> <span id="reelYear"></span></span>
      <span><span id="reelDuration"></span> · <span data-i18n="hero.sound"></span></span>
    </div>

    <figure class="reel reveal">
      <button class="reel__btn" id="reelBtn" type="button" aria-label="Play showreel">
        <img class="reel__poster" id="reelPoster" alt="" decoding="async" />
        <span class="reel__play" aria-hidden="true">
          <svg viewBox="0 0 20 22" fill="none"><path d="M19 11 1 21V1z" stroke="currentColor" stroke-width="1"/></svg>
        </span>
        <span class="reel__bar">
          <span class="mono" data-i18n="hero.reeltag"></span>
          <span class="mono" data-i18n="hero.play"></span>
        </span>
      </button>
    </figure>
  </section>

  <!-- ░░ WORK ░░ -->
  <section class="section" id="work">
    <div class="idx__top mono reveal">
      <span id="workCount"></span>
      <span data-i18n="work.sort"></span>
    </div>
    <div class="idx__cols mono reveal">
      <span>№</span>
      <span data-i18n="work.col.title"></span>
      <span data-i18n="work.col.client"></span>
      <span data-i18n="work.col.format"></span>
      <span data-i18n="work.col.year"></span>
    </div>
    <div class="idx" id="workIndex"></div>
  </section>

  <!-- ░░ FRAMES ░░ -->
  <section class="section" id="frames">
    <div class="section__label mono reveal" data-i18n="frames.label"></div>
    <div class="frames" id="framesGrid"></div>
  </section>

  <!-- ░░ ABOUT ░░ -->
  <section class="section" id="about">
    <div class="section__label mono reveal" data-i18n="about.label"></div>
    <div class="about">
      <p class="about__text reveal" id="aboutText"></p>
      <dl class="about__facts mono reveal" id="aboutFacts"></dl>
    </div>
  </section>

  <!-- ░░ CONTACT ░░ -->
  <section class="section section--contact" id="contact">
    <div class="contact reveal">
      <a class="contact__email" id="contactEmail" href="#"></a>
      <ul class="contact__socials mono" id="socials"></ul>
    </div>
  </section>
</main>

<footer class="footer mono">
  <span id="footCopy"></span>
  <span id="footCity"></span>
</footer>

<!-- ░░ VIDEO MODAL ░░ -->
<div class="modal" id="modal" hidden>
  <button class="modal__backdrop" id="modalBackdrop" tabindex="-1" aria-hidden="true"></button>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Video">
    <button class="modal__close mono" id="modalClose">
      <span data-i18n="modal.close"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
    <div class="modal__stage" id="modalStage"></div>
    <div class="modal__meta mono" id="modalMeta"></div>
  </div>
</div>

<!-- ░░ LIGHTBOX ░░ -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__backdrop" id="lbBackdrop" tabindex="-1" aria-hidden="true"></button>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M15 4L7 12l8 8"/></svg>
  </button>
  <figure class="lightbox__figure">
    <img id="lbImg" alt="" />
    <figcaption class="mono" id="lbCap"></figcaption>
  </figure>
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <button class="lightbox__close" id="lbClose" aria-label="Close">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 2l12 12M14 2L2 14"/></svg>
  </button>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
